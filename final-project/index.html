<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rick and Morty Explorer | Proyecto Final Frontend</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Encabezado / Header Semántico -->
  <header class="header">
    <div class="header-container">
      <h1 class="logo">Rick & Morty <span>Explorer</span></h1>
      <div class="header-actions">
        <div class="fav-counter" aria-label="Contador de favoritos">
          ❤️ Favoritos: <span id="fav-count">0</span>
        </div>
        <button id="theme-toggle" class="btn-theme" aria-label="Cambiar tema">🌙</button>
      </div>
    </div>
  </header>

  <!-- Filtros y Búsqueda -->
  <section class="controls-section">
    <div class="controls-container">
      <div class="search-box">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Buscar personaje por nombre..." 
          aria-label="Buscar personaje"
        >
      </div>
      <div class="filter-box">
        <select id="status-filter" aria-label="Filtrar por estado">
          <option value="">Todos los estados</option>
          <option value="alive">Vivos (Alive)</option>
          <option value="dead">Muertos (Dead)</option>
          <option value="unknown">Desconocidos (Unknown)</option>
        </select>
        <button id="btn-show-favs" class="btn-secondary">Ver Solo Favoritos</button>
      </div>
    </div>
  </section>

  <!-- Contenedor Principal -->
  <main class="main-content">
    <div id="loading" class="status-msg">Cargando personajes del multiverso...</div>
    <div id="error" class="status-msg error-msg hidden">Hubo un error al cargar los datos.</div>
    <div id="no-results" class="status-msg hidden">No se encontraron personajes.</div>

    <!-- Grid de Tarjetas -->
    <div id="characters-grid" class="cards-grid"></div>
  </main>

  <!-- Modal Accesible de Detalle -->
  <div id="detail-modal" class="modal hidden" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-content">
      <button class="modal-close" id="modal-close" aria-label="Cerrar modal">&times;</button>
      <div id="modal-body">
        <!-- Inyección dinámica con JS -->
      </div>
    </div>
  </div>

  <!-- Pie de página -->
  <footer class="footer">
    <p>Proyecto Final Frontend - 4.° Semestre | Desarrollado por CypherrFS</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
